<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OP籌碼贏家">
  <title>OP 籌碼贏家 Pro — 台指選擇權主力籌碼與三線量化系統</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="chartTooltip" class="chart-tooltip"></div>

  <!-- Fixed Top Navigation (參照 op-win.com 導覽列) -->
  <header class="top-navbar">
    <div class="nav-container">
      <div class="brand-wrap" onclick="switchView('realtime')">
        <div class="brand-badge">OP</div>
        <div>
          <div class="brand-name">OP 籌碼贏家 <span style="color:#38bdf8;font-size:0.8rem">PRO</span></div>
          <div class="brand-tag">台指選擇權主力籌碼量化系統</div>
        </div>
      </div>

      <nav class="top-nav-links">
        <button class="top-nav-btn active" data-tab="realtime" onclick="switchView('realtime')">📊 即時籌碼三線圖</button>
        <button class="top-nav-btn" data-tab="strikes" onclick="switchView('strikes')">🎯 選擇權籌碼 T 字表</button>
        <button class="top-nav-btn" data-tab="sim" onclick="switchView('sim')">🎮 週選模擬操作</button>
        <button class="top-nav-btn" data-tab="replay" onclick="switchView('replay')">⏪ K線盤勢復盤</button>
        <button class="top-nav-btn" data-tab="academy" onclick="switchView('academy')">🎓 盤勢分析與教學</button>
      </nav>
    </div>
  </header>

  <!-- Live Market Ticker Bar -->
  <div class="ticker-bar">
    <div class="ticker-inner" id="tickerBarContent"></div>
  </div>

  <!-- Main Content Area -->
  <main class="main-container">
    <section id="tab-realtime" class="tab-view active"></section>
    <section id="tab-strikes" class="tab-view"></section>
    <section id="tab-sim" class="tab-view"></section>
    <section id="tab-replay" class="tab-view"></section>
    <section id="tab-academy" class="tab-view"></section>
  </main>

  <!-- Strike Price Intraday & Weekly Volume/Price Curve Modal -->
  <div id="strikeModal" class="modal-backdrop" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-card" id="strikeModalContent"></div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-bottom-nav">
    <button class="m-nav-btn active" data-tab="realtime" onclick="switchView('realtime')">
      <span style="font-size:1.15rem">📊</span>
      <span>即時三線</span>
    </button>
    <button class="m-nav-btn" data-tab="strikes" onclick="switchView('strikes')">
      <span style="font-size:1.15rem">🎯</span>
      <span>T字籌碼</span>
    </button>
    <button class="m-nav-btn" data-tab="sim" onclick="switchView('sim')">
      <span style="font-size:1.15rem">🎮</span>
      <span>模擬操作</span>
    </button>
    <button class="m-nav-btn" data-tab="replay" onclick="switchView('replay')">
      <span style="font-size:1.15rem">⏪</span>
      <span>K線復盤</span>
    </button>
    <button class="m-nav-btn" data-tab="academy" onclick="switchView('academy')">
      <span style="font-size:1.15rem">🎓</span>
      <span>分析教學</span>
    </button>
  </nav>

  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
